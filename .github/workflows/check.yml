name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift-format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/format.sh --lint

  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check
